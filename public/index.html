<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Lifeolozy Admin</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="w"><div class="art" id="box"></div></div>
<script>
const $=s=>document.querySelector(s);let T=sessionStorage.lzt_admin||'',D={};
const api=async(p,o={})=>{o.headers={...(o.headers||{}),authorization:'Bearer '+T};const r=await fetch('/api/'+p,o);const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j};
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
function login(){$('#box').innerHTML='<h2>Admin Login</h2><label>Password</label><input id="pw" type="password"><br><br><button class="btn" id="go">Login</button>';
 $('#go').onclick=async()=>{try{const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);T=j.token;sessionStorage.lzt_admin=T;main()}catch(e){alert(e.message)}}}
async function up(file,target){if(!file)return;const r=await api('upload',{method:'POST',body:file,headers:{'content-type':file.type}});$(target).value=r.url;alert('Image uploaded')}
async function main(){try{D=await api('data')}catch(e){return login()}
 const o=D.secs.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join(''),s=D.s||{};
 const esc=x=>String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
 $('#box').innerHTML=`<h2>Lifeolozy Admin</h2><div class="tabs"><button class="btn" data-t="t1">Add Content</button><button class="btn off" data-t="t2">Add Product</button><button class="btn off" data-t="t3">Google Ads</button><button class="btn off" data-t="t4">Manage</button><a class="btn off" href="/">View Site</a></div>
 <div class="tb" id="t1"><label>Section</label><select id="as">${o}</select><label>Title</label><input id="at"><label>Image (URL or upload)</label><input id="ai" placeholder="https://… or upload below"><input type="file" id="af" accept="image/*"><label>Full content (blank line = new paragraph)</label><textarea id="ab" style="min-height:240px"></textarea><label>FAQ (one per line: Question | Answer)</label><textarea id="aq"></textarea><br><br><button class="btn" id="sa">Publish</button></div>
 <div class="tb" id="t2" hidden><label>Section</label><select id="ps">${o}</select><label>Product name</label><input id="pn"><label>Price</label><input id="pp" placeholder="$19.99"><label>Image (URL or upload)</label><input id="pi"><input type="file" id="pf" accept="image/*"><label>Buy link</label><input id="pl"><br><br><button class="btn" id="sp">Add Product</button></div>
 <div class="tb" id="t3" hidden><label>Head code (AdSense verification / auto ads script)</label><textarea id="ah">${esc(s.head)}</textarea><label>Top banner ad code</label><textarea id="ax">${esc(s.top)}</textarea><label>In-article ad code</label><textarea id="an">${esc(s.inart)}</textarea><br><br><button class="btn" id="sd">Save Ad Codes</button></div>
 <div class="tb" id="t4" hidden><h3>Articles</h3>${D.arts.map(a=>`<div class="row"><a href="/a/${a.slug}" target="_blank">${esc(a.title)}</a><button class="btn off" data-da="${a.id}">Delete</button></div>`).join('')}<h3>Products</h3>${D.prods.map(p=>`<div class="row"><span>${esc(p.name)}</span><button class="btn off" data-dp="${p.id}">Delete</button></div>`).join('')}<br><button class="btn off" id="lo">Logout</button></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tb').forEach(x=>x.hidden=true);$('#'+b.dataset.t).hidden=false;document.querySelectorAll('[data-t]').forEach(x=>x.classList.add('off'));b.classList.remove('off')});
 $('#af').onchange=e=>up(e.target.files[0],'#ai');$('#pf').onchange=e=>up(e.target.files[0],'#pi');
 const go=async f=>{try{await f();alert('Done');main()}catch(e){alert(e.message)}};
 $('#sa').onclick=()=>go(()=>post('article',{sec:$('#as').value,title:$('#at').value,img:$('#ai').value,body:$('#ab').value,faq:$('#aq').value.split('\n').filter(x=>x.includes('|')).map(x=>x.split('|').map(y=>y.trim()))}));
 $('#sp').onclick=()=>go(()=>post('product',{sec:$('#ps').value,name:$('#pn').value,price:$('#pp').value,img:$('#pi').value,link:$('#pl').value}));
 $('#sd').onclick=()=>go(()=>post('settings',{head:$('#ah').value,top:$('#ax').value,inart:$('#an').value}));
 document.querySelectorAll('[data-da]').forEach(b=>b.onclick=()=>confirm('Delete?')&&go(()=>api('article?id='+b.dataset.da,{method:'DELETE'})));
 document.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>confirm('Delete?')&&go(()=>api('product?id='+b.dataset.dp,{method:'DELETE'})));
 $('#lo').onclick=()=>{sessionStorage.clear();location.reload()}}
T?main():login();
</script></body></html>
